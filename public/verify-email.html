<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐브 - 이메일 인증</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔷</div>
      <h1>큐브</h1>
      <p>이메일 인증</p>
    </div>
    
    <div class="verification-container" id="verificationContainer">
      <div class="spinner"></div>
      <h2>인증 처리중...</h2>
      <p>잠시만 기다려주세요.</p>
    </div>
  </div>

  <script>
    async function verifyEmail() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      
      const container = document.getElementById('verificationContainer');

      if (!token) {
        container.innerHTML = `
          <div class="verification-icon">❌</div>
          <h2>유효하지 않은 링크</h2>
          <p>인증 토큰이 없습니다. 이메일의 링크를 다시 확인해주세요.</p>
          <a href="/login.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; margin-top: 20px;">
            로그인 페이지로
          </a>
        `;
        return;
      }

      try {
        const response = await fetch(`/api/auth/verify-email?token=${token}`);
        const data = await response.json();

        if (data.success) {
          container.innerHTML = `
            <div class="verification-icon">✅</div>
            <h2>인증 완료!</h2>
            <p>${data.message}</p>
            <p style="color: #4299e1; font-weight: 600; margin-top: 10px;">
              3초 후 로그인 페이지로 이동합니다...
            </p>
            <a href="/login.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; margin-top: 20px;">
              지금 로그인하기
            </a>
          `;
          
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } else {
          container.innerHTML = `
            <div class="verification-icon">⚠️</div>
            <h2>인증 실패</h2>
            <p>${data.message}</p>
            <a href="/login.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; margin-top: 20px;">
              로그인 페이지로
            </a>
          `;
        }
      } catch (error) {
        console.error('인증 오류:', error);
        container.innerHTML = `
          <div class="verification-icon">❌</div>
          <h2>오류 발생</h2>
          <p>인증 처리 중 오류가 발생했습니다. 나중에 다시 시도해주세요.</p>
          <a href="/login.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; margin-top: 20px;">
            로그인 페이지로
          </a>
        `;
      }
    }

    // 페이지 로드 시 인증 시작
    verifyEmail();
  </script>
</body>
</html>
