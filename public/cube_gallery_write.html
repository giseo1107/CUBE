<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="og:type" content="website" />
    <meta name="twitter:card" content="photo" />
    <title>큐브 갤러리 - 글쓰기</title>

    <!-- Stylesheets -->
   <link rel="stylesheet" type="text/css" href="css/cube_gallery_write.css">
  </head>

  <body>
    <div class="cubeu95galleryu952 screen">

      <!-- ==============================
           Header / Navigation
           ============================== -->
      <header class="header">
        <div class="container">

          <!-- 로고 + 로그인 영역 -->
          <div class="container-1">
            <!-- 로고 이미지 -->
            <div class="image"></div>

            <!-- 브랜드명 -->
            <div class="container-2">
              <div class="paragraph-1">
                <h1 class="title">C.C.C</h1>
              </div>
              <div class="paragraph-2">
                <p class="custom-cube-company">Custom Cube Company</p>
              </div>
            </div>

            <!-- 로그인 / 회원가입 -->
            <div class="container-3">
              <div class="paragraph-3">
                <span class="text-11 balooda2-bold-white-14px">로그인</span>
              </div>
              <div class="paragraph-4">
                <span class="text-12 balooda2-bold-white-14px">회원가입</span>
              </div>
            </div>
          </div>

          <!-- 네비게이션 메뉴 -->
          <nav class="container-4">
            <div class="paragraph-5">
              <a href="/custom-cube" class="text-1 balooda2-bold-white-14px">커스텀 큐브</a>
            </div>
            <div class="paragraph">
              <a href="/gallery" class="text-1 balooda2-bold-white-14px">큐브 갤러리</a>
            </div>
            <div class="paragraph-6">
              <a href="/market" class="text-15 balooda2-bold-white-14px">중고 큐브마켓</a>
            </div>
            <div class="paragraph">
              <a href="/curation" class="text-1 balooda2-bold-white-14px">큐레이션 샵</a>
            </div>
            <div class="paragraph-7">
              <a href="/qna" class="qn-a balooda2-bold-white-14px">QnA 및 후기</a>
            </div>
            <div class="paragraph-8">
              <a href="/reservation" class="text-17 balooda2-bold-white-14px">방문 예약</a>
            </div>
          </nav>

        </div>
      </header>

      <!-- ==============================
           Main Content - 글쓰기 폼
           ============================== -->
      <main class="container-5">

        <!-- 페이지 타이틀 -->
        <div class="container-6">
          <div class="heading-1">
            <h2 class="text-1-1">글쓰기</h2>
          </div>
          <div class="paragraph-9">
            <p class="text-2">큐브 갤러리에 새로운 작품을 공유해보세요</p>
          </div>
        </div>

        <!-- 글쓰기 폼 -->
        <form class="form" action="/gallery/post" method="POST" enctype="multipart/form-data">

          <!-- 제목 입력 -->
          <div class="container-7">
            <label class="label label-2" for="post-title">
              <span class="text arial-regular-normal-white-16px">제목</span>
            </label>
            <input
              class="text-input"
              id="post-title"
              type="text"
              name="title"
              placeholder="작품 제목을 입력하세요"
              required
            />
          </div>

          <!-- 내용 입력 -->
          <div class="container-8">
            <label class="label label-2" for="post-content">
              <span class="text arial-regular-normal-white-16px">내용</span>
            </label>
            <textarea
              class="text-area"
              id="post-content"
              name="content"
              placeholder="작품에 대한 설명을 입력하세요"
              required
            ></textarea>
          </div>

          <!-- 이미지 업로드 -->
          <div class="container-9">
            <label class="label label-2" for="post-image">
              <span class="text arial-regular-normal-white-16px">이미지</span>
            </label>
            <label class="label-1 label-2" for="post-image">
              <div class="icon">
                <img class="vector"   src="/img/vector.svg"   alt="" aria-hidden="true" />
                <img class="vector-1" src="/img/vector-1.svg" alt="" aria-hidden="true" />
                <img class="vector-2" src="/img/vector-2.svg" alt="" aria-hidden="true" />
              </div>
              <div class="paragraph-10">
                <span class="text-8">클릭하여 이미지 업로드</span>
              </div>
              <div class="paragraph-11">
                <p class="png-jpg-webp-10-mb">PNG, JPG, WEBP (최대 10MB)</p>
              </div>
            </label>
            <input
              id="post-image"
              type="file"
              name="image"
              accept="image/png, image/jpeg, image/webp"
              style="display: none;"
            />
          </div>

          <!-- 버튼 영역 -->
          <div class="container-10">
            <button
              type="button"
              class="button button-2"
              onclick="history.back()"
            >
              <span class="text-9 arial-regular-normal-white-16px">취소</span>
            </button>
            <button
              type="submit"
              class="button-1 button-2"
            >
              <span class="text-10 arial-regular-normal-white-16px">게시하기</span>
            </button>
          </div>

        </form>
      </main>

    </div>
  </body>
</html>
