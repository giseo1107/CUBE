<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐브 - 로그인</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔷</div>
      <h1>큐브</h1>
      <p>로그인하여 시작하세요</p>
    </div>
    <div class="form-container">
      <div id="alertBox" class="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" required placeholder="이메일을 입력하세요">
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" required placeholder="비밀번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
      <div class="link-text">
        계정이 없으신가요? <a href="/signup.html">회원가입</a>
      </div>
    </div>
  </div>
  <script>
const loginForm = document.getElementById('loginForm');
const alertBox = document.getElementById('alertBox');

// 알림 표시 함수
function showAlert(message, type) {
  alertBox.textContent = message;
  alertBox.className = `alert alert-${type} show`;
  setTimeout(() => {
    alertBox.classList.remove('show');
  }, 5000);
}

// 로그인 처리
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  // 관리자 로그인 분기
  if (email === 'admin' && password === 'admin') {
    try {
      const res  = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: 'admin', password: 'admin' })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/admin.html';
      } else {
        showAlert('관리자 로그인에 실패했습니다.', 'error');
      }
    } catch {
      showAlert('서버 오류가 발생했습니다.', 'error');
    }
    return;
  }

  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });

    // 응답 상태와 내용을 모두 로깅
    console.log('응답 상태:', response.status);
    console.log('응답 OK:', response.ok);
    
    // 응답을 텍스트로 먼저 받아서 확인
    const responseText = await response.text();
    console.log('응답 원본:', responseText);
    
    // JSON 파싱 시도
    let data;
    try {
      data = JSON.parse(responseText);
      console.log('파싱된 데이터:', data);
    } catch (parseError) {
      console.error('JSON 파싱 오류:', parseError);
      throw new Error('서버 응답을 처리할 수 없습니다.');
    }

    // 로그인 성공
    if (data.success === true) {
      showAlert('로그인 성공! 메인페이지로 이동합니다...', 'success');
      setTimeout(() => {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/index.html';
        window.location.href = redirect;
      }, 1000);
      return;
    }
    
    // 이메일 인증 필요 (여러 케이스 체크)
    if (data.needsVerification === true || 
        data.needsVerification === 'true' ||
        (data.message && data.message.includes('인증')) ||
        (data.error && data.error.includes('인증'))) {
      
      const resend = confirm('이메일 인증이 필요합니다.\n인증 메일을 다시 받으시겠습니까?');
      if (resend) {
        const resendResponse = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: data.email || email })
        });
        
        const resendData = await resendResponse.json();
        if (resendData.success) {
          showAlert('인증 메일이 발송되었습니다. 이메일을 확인해주세요.', 'info');
        } else {
          showAlert(resendData.message || '인증 메일 발송에 실패했습니다.', 'error');
        }
      } else {
        showAlert('이메일 인증 후 로그인해주세요.', 'warning');
      }
      return;
    }
    
    // 그 외 실패 (message 또는 error 필드 확인)
    const errorMessage = data.message || data.error || '로그인에 실패했습니다.';
    showAlert(errorMessage, 'error');
    
  } catch (error) {
    console.error('로그인 오류:', error);
    showAlert('로그인 처리 중 오류가 발생했습니다.', 'error');
  }
});

// 이미 로그인된 경우 마이페이지로 리다이렉트
async function checkAuth() {
  try {
    const response = await fetch('/api/auth/check');
    if (response.ok) {
      const data = await response.json();
      if (data.authenticated === true) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/mypage.html';
        window.location.href = redirect;
      }
    }
  } catch (error) {
    console.error('인증 확인 오류:', error);
  }
}

checkAuth();
</script>
<script src="js/navbar.js"></script>
</body>
</html>
