<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐브 - 회원가입</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔷</div>
      <h1>큐브</h1>
      <p>새로운 계정을 만드세요</p>
    </div>
    
    <div class="form-container">
      <div id="alertBox" class="alert"></div>
      
      <form id="signupForm">
        <div class="form-group">
          <label for="email">이메일 *</label>
          <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>
        
        <div class="form-group">
          <label for="password">비밀번호 *</label>
          <input type="password" id="password" name="password" required 
                 placeholder="8자 이상 입력하세요" minlength="8">
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">비밀번호 확인 *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required 
                 placeholder="비밀번호를 다시 입력하세요" minlength="8">
        </div>
        
        <div class="form-group">
          <label for="nickname">닉네임 *</label>
          <input type="text" id="nickname" name="nickname" required 
                 placeholder="닉네임을 입력하세요" maxlength="20">
        </div>
        
        <div class="form-group">
          <label for="tel_number">휴대전화 번호 *</label>
          <input type="tel" id="tel_number" name="tel_number" required 
                 placeholder="010-1234-5678" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}">
        </div>
        
        <div class="form-group">
          <label for="address">기본 주소 *</label>
          <input type="text" id="address" name="address" required 
                 placeholder="기본 주소를 입력하세요">
        </div>
        
        <div class="form-group">
          <label for="address_detail">상세 주소</label>
          <input type="text" id="address_detail" name="address_detail" 
                 placeholder="상세 주소를 입력하세요 (선택)">
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="marketing_agree" name="marketing_agree">
          <label for="marketing_agree">마케팅 수신 동의 (선택)</label>
        </div>
        
        <button type="submit" class="btn btn-primary">회원가입</button>
      </form>
      
      <div class="link-text">
        이미 계정이 있으신가요? <a href="/login.html">로그인</a>
      </div>
    </div>
  </div>

  <script>
    const signupForm = document.getElementById('signupForm');
    const alertBox = document.getElementById('alertBox');

    // 알림 표시 함수
    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 5000);
    }

    // 비밀번호 확인 검증
    document.getElementById('confirmPassword').addEventListener('input', function() {
      const password = document.getElementById('password').value;
      const confirmPassword = this.value;
      
      if (password !== confirmPassword && confirmPassword.length > 0) {
        this.setCustomValidity('비밀번호가 일치하지 않습니다.');
      } else {
        this.setCustomValidity('');
      }
    });

    // 회원가입 처리
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        showAlert('비밀번호가 일치하지 않습니다.', 'error');
        return;
      }

      const formData = {
        email: document.getElementById('email').value,
        password: password,
        nickname: document.getElementById('nickname').value,
        tel_number: document.getElementById('tel_number').value,
        address: document.getElementById('address').value,
        address_detail: document.getElementById('address_detail').value || null,
        marketing_agree: document.getElementById('marketing_agree').checked
      };

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
          showAlert('회원가입이 완료되었습니다! 이메일을 확인하여 인증을 완료해주세요.', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } else {
          showAlert(data.message, 'error');
        }
      } catch (error) {
        console.error('회원가입 오류:', error);
        showAlert('회원가입 처리 중 오류가 발생했습니다.', 'error');
      }
    });

    // 전화번호 자동 포맷팅
    document.getElementById('tel_number').addEventListener('input', function(e) {
      let value = e.target.value.replace(/[^0-9]/g, '');
      let formatted = '';
      
      if (value.length <= 3) {
        formatted = value;
      } else if (value.length <= 7) {
        formatted = value.slice(0, 3) + '-' + value.slice(3);
      } else if (value.length <= 11) {
        formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
      } else {
        formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
      }
      
      e.target.value = formatted;
    });
  </script>
</body>
</html>
