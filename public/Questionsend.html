<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의 완료 - C.C.C</title>
  <link rel="stylesheet" href="css/QuestionSend.css" />
</head>
<body>

  <!-- ── 히어로 배너 ── -->
  <section class="hero">
    <div class="breadcrumb">
      <a href="/QnA.html">자주 묻는 질문</a>
      <span>/</span>
      <span class="current">1:1 문의하기</span>
    </div>
    <h1>1:1 문의하기</h1>
    <p>궁금하신 사항을 남겨주시면 전문 상담원이 빠르게 답변드립니다</p>
  </section>

  <!-- ── 완료 카드 ── -->
  <div class="complete-wrap">
    <div class="complete-card">
      <div class="success-icon">
        <img src="img/vector.svg" alt="완료" />
      </div>
      <h2>문의가 접수되었습니다</h2>
      <p>
        담당자가 확인 후 입력하신 이메일
        (<span class="email-highlight" id="displayEmail">-</span>)로<br>
        영업일 기준 1~2일 내에 답변드리겠습니다.
      </p>
      <div class="btn-group">
        <button class="btn-outline" onclick="location.href='/Question.html'">추가 문의하기</button>
        <button class="btn-primary" onclick="location.href='/QnA.html'">FAQ로 돌아가기</button>
      </div>
    </div>
  </div>

  <script>
    // Question.html에서 sessionStorage로 넘겨준 이메일 표시
    const email = sessionStorage.getItem('inqEmail');
    if (email) {
      document.getElementById('displayEmail').textContent = email;
      sessionStorage.removeItem('inqEmail');
    }

    // 직접 URL 진입(새로고침 등) 방어 - 이메일 없으면 FAQ로
    if (!email) {
      // 이메일은 없지만 페이지는 보여줌 (단순 완료 화면)
      document.getElementById('displayEmail').textContent = '입력하신 이메일';
    }
  </script>

</body>
</html>
