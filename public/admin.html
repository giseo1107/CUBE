<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: 'Noto Sans KR', Arial, sans-serif; min-height: 100vh; }

    /* ── 헤더 ── */
    .admin-header {
      background: #1e2939;
      border-bottom: 1px solid #2d3748;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 100;
    }
    .admin-header h1 { font-size: 18px; font-weight: 700; color: #aff9f5; }
    .btn-logout {
      background: none; border: 1px solid #4b5563; color: #9ca3af;
      padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px;
      transition: all 0.15s;
    }
    .btn-logout:hover { border-color: #f87171; color: #f87171; }

    /* ── 탭 ── */
    .tab-nav {
      display: flex; gap: 4px; padding: 20px 32px 0;
      border-bottom: 1px solid #2d3748;
    }
    .tab-btn {
      padding: 10px 22px; background: none; border: none; border-radius: 8px 8px 0 0;
      color: #6b7280; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.15s; border-bottom: 3px solid transparent;
    }
    .tab-btn:hover { color: #e2e8f0; }
    .tab-btn.is-active { color: #aff9f5; border-bottom-color: #aff9f5; background: rgba(175,249,245,0.05); }

    /* ── 콘텐츠 ── */
    .tab-content { display: none; padding: 28px 32px; }
    .tab-content.is-active { display: block; }

    /* ── 섹션 카드 ── */
    .admin-section { background: #1e2939; border: 1px solid #2d3748; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .admin-section h2 { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 18px; }

    /* ── 테이블 ── */
    .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .admin-table th { background: #111827; color: #6b7280; font-weight: 600; padding: 10px 14px; text-align: left; border-bottom: 1px solid #2d3748; }
    .admin-table td { padding: 11px 14px; border-bottom: 1px solid #1a2535; color: #cbd5e1; vertical-align: top; }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── 뱃지 ── */
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-wait  { background: #fff7ed; color: #f59e0b; }
    .badge-done  { background: #f0fdf4; color: #22c55e; }
    .badge-cancel{ background: #fef2f2; color: #ef4444; }

    /* ── 버튼 ── */
    .btn { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.8; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-success { background: #22c55e; color: #fff; }

    /* ── 문의 답변 ── */
    .inq-detail { background: #111827; border-radius: 8px; padding: 14px; margin-top: 8px; }
    .inq-detail p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .inq-answer-form { margin-top: 10px; display: flex; gap: 8px; }
    .inq-answer-form textarea {
      flex: 1; background: #1e2939; border: 1px solid #374151; border-radius: 6px;
      color: #e2e8f0; padding: 8px 12px; font-size: 13px; resize: vertical; min-height: 60px;
      outline: none;
    }
    .inq-answer-form textarea:focus { border-color: #667eea; }

    /* ── 빈 상태 ── */
    .empty-state { text-align: center; color: #4b5563; padding: 40px; font-size: 14px; }

    /* ── 로딩 ── */
    .loading { text-align: center; color: #4b5563; padding: 30px; font-size: 14px; }

    /* ── 통계 카드 ── */
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #1e2939; border: 1px solid #2d3748; border-radius: 12px; padding: 20px 24px; }
    .stat-card .stat-label { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
    .stat-card .stat-value { font-size: 28px; font-weight: 700; color: #f1f5f9; }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>🛠 Container House 관리자</h1>
    <button class="btn-logout" id="logoutBtn">로그아웃</button>
  </header>

  <div class="tab-nav">
    <button class="tab-btn is-active" onclick="switchTab('tabUsers')">사용자 관리</button>
    <button class="tab-btn" onclick="switchTab('tabOrders')">주문 내역</button>
    <button class="tab-btn" onclick="switchTab('tabReservations')">예약 관리</button>
    <button class="tab-btn" onclick="switchTab('tabInquiries')">문의 관리</button>
    <button class="tab-btn" onclick="switchTab('tabReviews')">후기 관리</button>
    <button class="tab-btn" onclick="switchTab('tabGallery')">갤러리 관리</button>
  </div>

  <!-- 사용자 관리 -->
  <div class="tab-content is-active" id="tabUsers">
    <div class="admin-section">
      <h2>회원 목록</h2>
      <div id="userTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 주문 내역 -->
  <div class="tab-content" id="tabOrders">
    <div class="admin-section">
      <h2>전체 주문 내역</h2>
      <div id="orderTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 예약 관리 -->
  <div class="tab-content" id="tabReservations">
    <div class="admin-section">
      <h2>방문 예약 목록</h2>
      <div id="reservationTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 문의 관리 -->
  <div class="tab-content" id="tabInquiries">
    <div class="admin-section">
      <h2>1:1 문의 목록</h2>
      <div id="inquiryTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 후기 관리 -->
  <div class="tab-content" id="tabReviews">
    <div class="admin-section">
      <h2>고객 후기 목록</h2>
      <div id="reviewTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 갤러리 관리 -->
  <div class="tab-content" id="tabGallery">
    <div class="admin-section">
      <h2>갤러리 게시글</h2>
      <div id="galleryTable"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>

<script>
// ── 관리자 인증 확인 ────────────────────────────────
(async () => {
  const res  = await fetch('/api/admin/check');
  const data = await res.json();
  if (!data.isAdmin) location.href = '/admin-login.html';
})();

// ── 로그아웃 ─────────────────────────────────────────
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.href = '/admin-login.html';
});

// ── 탭 전환 ─────────────────────────────────────────
const tabLoaders = {
  tabUsers:        loadUsers,
  tabOrders:       loadOrders,
  tabReservations: loadReservations,
  tabInquiries:    loadInquiries,
  tabReviews:      loadReviews,
  tabGallery:      loadGallery,
};
const loaded = {};

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('is-active', Object.keys(tabLoaders)[i] === tabId);
  });
  document.querySelectorAll('.tab-content').forEach(el => {
    el.classList.toggle('is-active', el.id === tabId);
  });
  if (!loaded[tabId] && tabLoaders[tabId]) {
    tabLoaders[tabId]();
    loaded[tabId] = true;
  }
}

// 최초 로드
loaded['tabUsers'] = true;
loadUsers();

// ── 유틸 ─────────────────────────────────────────────
function fmtDate(str) {
  if (!str) return '-';
  return new Date(str).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\.$/, '');
}
function fmtMoney(n) {
  return n ? Number(n).toLocaleString() + '원' : '-';
}
function fmtPayment(method) {
  const map = { money: '카카오페이', MONEY: '카카오페이', kakaopay: '카카오페이', KAKAOPAY: '카카오페이', kakao: '카카오페이' };
  return map[method] || method || '-';
}
const ORDER_STATUS = { paid: '결제 완료', pending: '결제 대기', cancelled: '취소됨', refunded: '환불됨' };

// ── 사용자 관리 ──────────────────────────────────────
async function loadUsers() {
  const el = document.getElementById('userTable');
  try {
    const data = await fetch('/api/admin/users').then(r => r.json());
    if (!data.data.length) { el.innerHTML = '<div class="empty-state">회원이 없습니다.</div>'; return; }
    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>ID</th><th>이메일</th><th>닉네임</th><th>가입일</th><th>인증</th><th>관리</th>
        </tr></thead>
        <tbody>
          ${data.data.map(u => `
            <tr>
              <td>${u.user_id}</td>
              <td>${u.email}</td>
              <td>${u.nickname || '-'}</td>
              <td>${fmtDate(u.created_at)}</td>
              <td>${u.email_verified ? '<span class="badge badge-done">인증</span>' : '<span class="badge badge-wait">미인증</span>'}</td>
              <td><button class="btn btn-danger" onclick="deleteUser(${u.user_id}, '${u.email}')">삭제</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch { el.innerHTML = '<div class="empty-state">불러오기 실패</div>'; }
}

async function deleteUser(id, email) {
  if (!confirm(`${email} 계정을 삭제하시겠습니까?`)) return;
  const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' }).then(r => r.json());
  if (res.success) { loaded['tabUsers'] = false; loadUsers(); loaded['tabUsers'] = true; }
  else alert(res.message);
}

// ── 주문 내역 ────────────────────────────────────────
async function loadOrders() {
  const el = document.getElementById('orderTable');
  try {
    const data = await fetch('/api/admin/orders').then(r => r.json());
    if (!data.data.length) { el.innerHTML = '<div class="empty-state">주문 내역이 없습니다.</div>'; return; }
    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>주문ID</th><th>회원</th><th>상품명</th><th>금액</th><th>결제수단</th><th>주문일</th><th>상태</th><th>관리</th>
        </tr></thead>
        <tbody>
          ${data.data.map(o => `
            <tr>
              <td>${o.order_id}</td>
              <td>${o.email || '-'}<br><span style="color:#6b7280;font-size:11px;">${o.nickname || ''}</span></td>
              <td>${o.item_name || '-'}</td>
              <td>${fmtMoney(o.total_amount)}</td>
              <td>${fmtPayment(o.payment_method_type)}</td>
              <td>${fmtDate(o.ordered_at)}</td>
              <td><span class="badge ${o.status === 'paid' ? 'badge-done' : 'badge-wait'}">${ORDER_STATUS[o.status] || o.status || '-'}</span></td>
              <td>${o.status !== 'paid' ? `<button class="btn btn-success" onclick="updateOrderStatus(${o.order_id},'paid')">결제 완료</button>` : '<span style="color:#4b5563;font-size:12px;">-</span>'}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch { el.innerHTML = '<div class="empty-state">불러오기 실패</div>'; }
}

async function updateOrderStatus(id, status) {
  const res = await fetch(`/api/admin/orders/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  }).then(r => r.json());
  if (res.success) { loaded['tabOrders'] = false; loadOrders(); loaded['tabOrders'] = true; }
  else alert(res.message || '상태 변경에 실패했습니다.');
}

// ── 예약 관리 ────────────────────────────────────────
const RES_STATUS = { confirmed: '예약 확정', cancelled: '취소됨', pending: '예약 신청' };

async function loadReservations() {
  const el = document.getElementById('reservationTable');
  try {
    const data = await fetch('/api/admin/reservations').then(r => r.json());
    if (!data.data.length) { el.innerHTML = '<div class="empty-state">예약이 없습니다.</div>'; return; }
    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>예약ID</th><th>이름</th><th>연락처</th><th>방문일</th><th>시간</th><th>인원</th><th>상태</th><th>관리</th>
        </tr></thead>
        <tbody>
          ${data.data.map(r => `
            <tr>
              <td>${r.res_id}</td>
              <td>${r.name || '-'}</td>
              <td>${r.phone || '-'}</td>
              <td>${fmtDate(r.visit_date)}</td>
              <td>${r.visit_time ? r.visit_time.slice(0, 5) : '-'}</td>
              <td>${r.people_count || '-'}명</td>
              <td><span class="badge ${r.status === 'confirmed' ? 'badge-done' : r.status === 'cancelled' ? 'badge-cancel' : 'badge-wait'}">${RES_STATUS[r.status] || '예약 대기'}</span></td>
              <td style="display:flex;gap:6px;">
                <button class="btn btn-success" onclick="updateRes(${r.res_id},'confirmed')">확정</button>
                <button class="btn btn-danger"  onclick="updateRes(${r.res_id},'cancelled')">취소</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch { el.innerHTML = '<div class="empty-state">불러오기 실패</div>'; }
}

async function updateRes(id, status) {
  const res = await fetch(`/api/admin/reservations/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  }).then(r => r.json());
  if (res.success) { loaded['tabReservations'] = false; loadReservations(); loaded['tabReservations'] = true; }
  else alert(res.message);
}

// ── 문의 관리 ────────────────────────────────────────
const INQ_TYPE = { product: '제품 문의', order: '구매/결제', install: '설치/시공', as: 'A/S' };

async function loadInquiries() {
  const el = document.getElementById('inquiryTable');
  try {
    const data = await fetch('/api/admin/inquiries').then(r => r.json());
    if (!data.data.length) { el.innerHTML = '<div class="empty-state">문의가 없습니다.</div>'; return; }
    el.innerHTML = data.data.map(inq => `
      <div style="border-bottom:1px solid #2d3748;padding:16px 0;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <span class="badge badge-wait">${INQ_TYPE[inq.type] || inq.type}</span>
          <span class="badge ${inq.status === 'answered' ? 'badge-done' : 'badge-wait'}">${inq.status === 'answered' ? '답변 완료' : '답변 대기'}</span>
          <span style="font-weight:700;color:#f1f5f9;">${inq.title}</span>
          <span style="color:#6b7280;font-size:12px;margin-left:auto;">${inq.name} · ${inq.email} · ${fmtDate(inq.created_at)}</span>
        </div>
        <div class="inq-detail">
          <p>${inq.content}</p>
          ${inq.answer ? `<p style="margin-top:10px;color:#aff9f5;">💬 답변: ${inq.answer}</p>` : ''}
        </div>
        ${inq.status !== 'answered' ? `
        <div class="inq-answer-form">
          <textarea id="ans-${inq.inquiry_id}" placeholder="답변을 입력하세요..."></textarea>
          <button class="btn btn-primary" onclick="replyInquiry(${inq.inquiry_id})">답변 등록</button>
        </div>` : ''}
      </div>`).join('');
  } catch { el.innerHTML = '<div class="empty-state">불러오기 실패</div>'; }
}

async function replyInquiry(id) {
  const answer = document.getElementById(`ans-${id}`).value.trim();
  if (!answer) return alert('답변 내용을 입력해주세요.');
  const res = await fetch(`/api/admin/inquiries/${id}/reply`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answer })
  }).then(r => r.json());
  if (res.success) { loaded['tabInquiries'] = false; loadInquiries(); loaded['tabInquiries'] = true; }
  else alert(res.message);
}

// ── 후기 관리 ────────────────────────────────────────
function avgRating(r) {
  const vals = [r.rating_quality, r.rating_durability, r.rating_interior,
                r.rating_custom, r.rating_maintenance, r.rating_service];
  const sum = vals.reduce((a, b) => a + (parseFloat(b) || 0), 0);
  return (sum / vals.length).toFixed(1);
}

async function loadReviews() {
  const el = document.getElementById('reviewTable');
  try {
    const data = await fetch('/api/admin/reviews').then(r => r.json());
    if (!data.data.length) { el.innerHTML = '<div class="empty-state">후기가 없습니다.</div>'; return; }
    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>ID</th><th>작성자</th><th>지역</th><th>모델</th><th>제목</th><th>평점</th><th>등록일</th><th>관리</th>
        </tr></thead>
        <tbody>
          ${data.data.map(r => `
            <tr>
              <td>${r.review_id}</td>
              <td>${r.author_name || '-'}</td>
              <td>${r.region || '-'}</td>
              <td>${r.model_name || '-'}</td>
              <td>${r.title}</td>
              <td>⭐ ${avgRating(r)}</td>
              <td>${fmtDate(r.created_at)}</td>
              <td><button class="btn btn-danger" onclick="adminDeleteReview(${r.review_id})">삭제</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch { el.innerHTML = '<div class="empty-state">불러오기 실패</div>'; }
}

async function adminDeleteReview(id) {
  if (!confirm('후기를 삭제하시겠습니까?')) return;
  const res = await fetch(`/api/admin/reviews/${id}`, { method: 'DELETE' }).then(r => r.json());
  if (res.success) { loaded['tabReviews'] = false; loadReviews(); loaded['tabReviews'] = true; }
  else alert(res.message);
}

// ── 갤러리 관리 ──────────────────────────────────────
async function loadGallery() {
  const el = document.getElementById('galleryTable');
  try {
    const data = await fetch('/api/admin/gallery').then(r => r.json());
    if (!data.data.length) { el.innerHTML = '<div class="empty-state">게시글이 없습니다.</div>'; return; }
    el.innerHTML = `
      <table class="admin-table">
        <thead><tr>
          <th>ID</th><th>제목</th><th>작성자</th><th>좋아요</th><th>조회수</th><th>등록일</th><th>관리</th>
        </tr></thead>
        <tbody>
          ${data.data.map(p => `
            <tr>
              <td>${p.post_id}</td>
              <td>${p.title}</td>
              <td>${p.author_name || '-'}</td>
              <td>❤️ ${p.like_count || 0}</td>
              <td>👁 ${p.view_count || 0}</td>
              <td>${fmtDate(p.created_at)}</td>
              <td><button class="btn btn-danger" onclick="deleteGallery(${p.post_id})">삭제</button></td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch { el.innerHTML = '<div class="empty-state">불러오기 실패</div>'; }
}

async function deleteGallery(id) {
  if (!confirm('게시글을 삭제하시겠습니까?')) return;
  const res = await fetch(`/api/admin/gallery/${id}`, { method: 'DELETE' }).then(r => r.json());
  if (res.success) { loaded['tabGallery'] = false; loadGallery(); loaded['tabGallery'] = true; }
  else alert(res.message);
}
</script>
</body>
</html>
