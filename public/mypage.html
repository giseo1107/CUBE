<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>큐브 - 마이페이지</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mypage.css">
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
</head>
<body style="padding-top: 100px">
  <div class="container mypage-container" style="margin-top: 30px;">
    <div class="profile-section">
      <div class="profile-image-wrapper">
        <div class="profile-image" id="profileImageContainer" title="클릭하여 프로필 이미지 변경">
          <span id="profileImagePlaceholder">👤</span>
        </div>
        <!-- 이미지가 있을 때만 표시되는 버튼들 -->
        <div class="profile-image-actions" id="profileImageActions" style="display: none;">
          <button type="button" class="profile-btn edit-btn" id="editImageBtn" title="이미지 수정">✏️</button>
          <button type="button" class="profile-btn delete-btn" id="deleteImageBtn" title="이미지 삭제">🗑️</button>
        </div>
      </div>
      <input type="file" id="profileImageInput" accept="image/*">
      <h2 id="userName">로딩중...</h2>
      <p id="userEmail">-</p>
    </div>
    
    <div class="form-container">
      <div id="alertBox" class="alert"></div>

      <!-- ===== 탭 네비게이션 ===== -->
      <div class="tab-nav">
        <button class="tab-btn is-active" data-tab="tabProfile" onclick="switchTab('tabProfile')">회원정보</button>
        <button class="tab-btn" data-tab="tabReservation" onclick="switchTab('tabReservation')">예약관리</button>
        <button class="tab-btn" data-tab="tabPayment" onclick="switchTab('tabPayment')">결제확인</button>
      </div>

      <!-- ===== 탭1: 회원정보 ===== -->
      <div class="tab-content is-active" id="tabProfile">

      <!-- 회원정보 섹션 -->
      <div class="section">
        <h3>회원정보</h3>
        <div class="info-row">
          <span class="info-label">이메일</span>
          <span class="info-value" id="displayEmail">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">닉네임</span>
          <span class="info-value" id="displayNickname">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">전화번호</span>
          <span class="info-value" id="displayPhone">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">주소</span>
          <span class="info-value" id="displayAddress">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">마케팅 수신</span>
          <span class="info-value" id="displayMarketing">-</span>
        </div>
      </div>

      <!-- 정보 수정 폼 -->
      <div class="section">
        <h3>정보 수정</h3>
        <form id="updateForm">
          <div class="form-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" name="nickname" maxlength="20">
          </div>
          
          <div class="form-group">
            <label for="tel_number">전화번호</label>
            <input type="tel" id="tel_number" name="tel_number" pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}">
          </div>
          
          <div class="form-group">
            <label for="address">기본 주소</label>
            <input type="text" id="address" name="address">
          </div>
          
          <div class="form-group">
            <label for="address_detail">상세 주소</label>
            <input type="text" id="address_detail" name="address_detail">
          </div>
          
          <div class="checkbox-group">
            <input type="checkbox" id="marketing_agree" name="marketing_agree">
            <label for="marketing_agree">마케팅 수신 동의</label>
          </div>
          
          <button type="submit" class="btn btn-primary">정보 수정</button>
        </form>
      </div>

      <!-- 비밀번호 변경 -->
      <div class="section">
        <h3>비밀번호 변경</h3>
        <form id="passwordForm">
          <div class="form-group">
            <label for="currentPassword">현재 비밀번호</label>
            <input type="password" id="currentPassword" required>
          </div>
          
          <div class="form-group">
            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" required minlength="8">
          </div>
          
          <div class="form-group">
            <label for="confirmNewPassword">새 비밀번호 확인</label>
            <input type="password" id="confirmNewPassword" required minlength="8">
          </div>
          
          <button type="submit" class="btn btn-primary">비밀번호 변경</button>
        </form>
      </div>

      <!-- 로그아웃 & 회원탈퇴 -->
      <button id="logoutBtn" class="btn btn-secondary">로그아웃</button>
      <button id="deleteAccountBtn" class="btn btn-danger">회원 탈퇴</button>

      </div><!-- /tabProfile -->

      <!-- ===== 탭2: 예약관리 ===== -->
      <div class="tab-content" id="tabReservation">
        <div class="section" style="background: transparent; padding: 0;">
          <h3>나의 예약</h3>
          <div id="reservationList">
            <div class="reservation-loading">예약 정보를 불러오는 중...</div>
          </div>
        </div>
      </div><!-- /tabReservation -->

      <!-- ===== 탭3: 결제확인 ===== -->
      <div class="tab-content" id="tabPayment">
        <div class="section" style="background: transparent; padding: 0;">
          <h3>결제 내역</h3>
          <div id="paymentList">
            <div class="reservation-loading">결제 내역을 불러오는 중...</div>
          </div>
        </div>
      </div><!-- /tabPayment -->

    </div>
  </div>

  <!-- 이미지 크롭 모달 -->
  <div class="crop-modal" id="cropModal">
    <div class="crop-container">
      <h3>프로필 이미지 편집</h3>
      <p style="text-align: center; color: #666; font-size: 14px; margin: -10px 0 10px 0;">
        원하는 영역을 선택하세요
      </p>
      <div class="crop-area">
        <img id="cropImage" src="" alt="Crop">
      </div>
      <div class="crop-buttons">
        <button id="cancelCrop" class="btn btn-secondary">취소</button>
        <button id="confirmCrop" class="btn btn-primary">적용</button>
      </div>
    </div>
  </div>

  <!-- Cropper.js 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <script>
    const alertBox = document.getElementById('alertBox');
    const profileImageContainer = document.getElementById('profileImageContainer');
    const profileImageInput = document.getElementById('profileImageInput');
    const profileImagePlaceholder = document.getElementById('profileImagePlaceholder');
    const profileImageActions = document.getElementById('profileImageActions');
    const editImageBtn = document.getElementById('editImageBtn');
    const deleteImageBtn = document.getElementById('deleteImageBtn');
    const cropModal = document.getElementById('cropModal');
    const cropImage = document.getElementById('cropImage');
    const cancelCrop = document.getElementById('cancelCrop');
    const confirmCrop = document.getElementById('confirmCrop');

    let cropper = null;
    let hasProfileImage = false;

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} show`;
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 5000);
    }

    // ========================================
    // 탭 전환
    // ========================================
    // URL hash로 탭 직접 이동 (#tabReservation 등)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash === 'tabReservation' || hash === 'tabPayment' || hash === 'tabProfile') {
        switchTab(hash);
      }
    });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.tab === tabId);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('is-active', content.id === tabId);
      });
      if (tabId === 'tabReservation') {
        loadReservations();
      }
      if (tabId === 'tabPayment') {
        loadPayments();
      }
    }

    // ========================================
    // 예약 관리
    // ========================================
    const DAYS = ['일','월','화','수','목','금','토'];

    function formatResDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
    }

    function formatResTime(timeStr) {
      const t = String(timeStr).substring(0, 5);
      const hour = parseInt(t.split(':')[0]);
      const min = t.split(':')[1];
      const period = hour >= 12 ? '오후' : '오전';
      const dh = hour > 12 ? hour - 12 : hour;
      return `${period} ${dh}시${min !== '00' ? ' ' + min + '분' : ''} (${t})`;
    }

    async function loadReservations() {
      const container = document.getElementById('reservationList');
      container.innerHTML = '<div class="reservation-loading">예약 정보를 불러오는 중...</div>';

      try {
        const response = await fetch('/api/reservation/my');
        const data = await response.json();

        if (!data.success || !data.reservations || data.reservations.length === 0) {
          container.innerHTML = `
            <div class="reservation-empty">
              <div class="reservation-empty-icon">📋</div>
              <p class="reservation-empty-text">현재 예약 내역이 없습니다.</p>
              <a href="/visit-reservation.html" class="btn btn-primary reservation-goto-btn">예약하러 가기</a>
            </div>
          `;
          return;
        }

        let html = '';
        data.reservations.forEach(r => {
          const dateStr = formatResDate(r.visit_date);
          const timeStr = formatResTime(r.visit_time);
          const isCancelled = r.status !== 'BOOKED';
          const statusClass = isCancelled ? 'rs-cancelled' : 'rs-booked';
          const statusText = isCancelled ? '취소됨' : '예약 확정';

          html += `
            <div class="res-card ${isCancelled ? 'is-cancelled' : ''}">
              <div class="res-card-header">
                <span class="res-card-number">RES-${r.res_id}</span>
                <span class="res-card-status ${statusClass}">${statusText}</span>
              </div>
              <table class="res-card-table">
                <tr><td class="res-label">방문 날짜</td><td class="res-value">${dateStr}</td></tr>
                <tr><td class="res-label">방문 시간</td><td class="res-value">${timeStr}</td></tr>
                <tr><td class="res-label">방문 인원</td><td class="res-value">${r.people_count}명</td></tr>
                <tr><td class="res-label">연락처</td><td class="res-value">${r.phone || '-'}</td></tr>
                <tr><td class="res-label">이메일</td><td class="res-value">${r.email || '-'}</td></tr>
                <tr>
                  <td class="res-label">방문 장소</td>
                  <td class="res-value">
                    C.C.C 큐브 시리즈 전시관
                    <span class="res-address">서울시 강남구 테헤란로 123 C.C.C 빌딩 1층</span>
                  </td>
                </tr>
              </table>
              ${!isCancelled ? `<div class="res-card-actions"><button class="btn btn-danger res-cancel-btn" onclick="cancelReservation(${r.res_id})">예약 취소</button></div>` : ''}
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error('예약 목록 로드 실패:', err);
        container.innerHTML = `
          <div class="reservation-empty">
            <div class="reservation-empty-icon">⚠️</div>
            <p class="reservation-empty-text">예약 정보를 불러올 수 없습니다.</p>
            <a href="/visit-reservation.html" class="btn btn-primary reservation-goto-btn">예약하러 가기</a>
          </div>
        `;
      }
    }

    async function cancelReservation(resId) {
      if (!confirm('정말 예약을 취소하시겠습니까?\n방문 24시간 이내에는 취소가 불가합니다.')) return;

      try {
        const response = await fetch(`/api/reservation/${resId}/cancel`, { method: 'PATCH' });
        const data = await response.json();

        if (data.success) {
          showAlert('예약이 취소되었습니다.', 'success');
          loadReservations();
        } else {
          showAlert(data.message || '예약 취소에 실패했습니다.', 'error');
        }
      } catch (err) {
        console.error('예약 취소 오류:', err);
        showAlert('예약 취소 중 오류가 발생했습니다.', 'error');
      }
    }


    // ========================================
    // 결제 확인
    // ========================================
    const METHOD_LABEL = {
      'CARD':  '신용/체크카드',
      'MONEY': '카카오머니',
      'POINT': '카카오포인트',
    };

    function fmtMoney(n) {
      return Number(n).toLocaleString('ko-KR') + '원';
    }

    function fmtDate(str) {
      if (!str) return '-';
      return new Date(str).toLocaleString('ko-KR', {
        year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    async function loadPayments() {
      const container = document.getElementById('paymentList');
      container.innerHTML = '<div class="reservation-loading">결제 내역을 불러오는 중...</div>';

      try {
        const res  = await fetch('/api/payment/history');
        const data = await res.json();

        if (!data.success || !data.payments || data.payments.length === 0) {
          container.innerHTML = `
            <div class="pay-empty">
              <div class="pay-empty-icon">💳</div>
              <p class="pay-empty-text">결제 내역이 없습니다.</p>
              <a href="/curation.html" class="btn btn-primary pay-goto-btn">큐레이션 샵 보러가기</a>
            </div>`;
          return;
        }

        let html = '';
        data.payments.forEach(p => {
          const method = METHOD_LABEL[p.payment_method_type] || (p.payment_method_type || '카카오페이');
          const approvedAt = fmtDate(p.approved_at || p.ordered_at);
          const itemName = p.item_name || '상품';

          // 선택 옵션 토글 렌더링 (cart와 동일한 방식)
          let optionsHtml = '';
          if (p.selected_options) {
            let opts = p.selected_options.split(',').map(s => s.trim()).filter(Boolean);
            // 커스텀큐브: 첫 항목(커스텀큐브:id) 제거
            if (opts.length > 0 && opts[0].startsWith('커스텀큐브:')) opts = opts.slice(1);
            if (opts.length > 0) {
              const rows = opts.map(opt => {
                const colonIdx = opt.lastIndexOf(':');
                let name, priceHtml;
                if (colonIdx > 0 && /^\d+$/.test(opt.slice(colonIdx + 1))) {
                  name      = opt.slice(0, colonIdx).trim();
                  const pr  = parseInt(opt.slice(colonIdx + 1), 10);
                  priceHtml = `<span class="pay-opt-price">+${pr.toLocaleString('ko-KR')}원</span>`;
                } else {
                  name      = opt;
                  priceHtml = '';
                }
                return `<div class="pay-opt-row"><span class="pay-opt-name">${name}</span>${priceHtml}</div>`;
              }).join('');
              optionsHtml = `
                <tr>
                  <td class="pay-label" style="vertical-align:top;padding-top:14px;">선택 옵션</td>
                  <td class="pay-value" style="padding:10px 0;">
                    <button class="pay-opts-toggle" onclick="togglePayOpts(this)" aria-expanded="false">
                      <span class="pay-opts-arrow">▼</span>
                      <span>옵션 보기</span>
                    </button>
                    <div class="pay-opts-list">${rows}</div>
                  </td>
                </tr>`;
            }
          }

          const orderedAt = fmtDate(p.ordered_at);
          const qty = p.quantity || 1;

          html += `
            <div class="pay-card">
              <div class="pay-card-header">
                <span class="pay-card-number">ORDER #${p.order_id}</span>
                <span class="pay-card-status">결제 완료</span>
              </div>
              <table class="pay-card-table">
                <tr><td class="pay-label">상품명</td><td class="pay-value">${itemName}</td></tr>
                <tr><td class="pay-label">수량</td><td class="pay-value">${qty}개</td></tr>
                ${optionsHtml}
                <tr><td class="pay-label">결제 방법</td><td class="pay-value">${method}</td></tr>
                <tr><td class="pay-label">주문 일시</td><td class="pay-value">${orderedAt}</td></tr>
                <tr><td class="pay-label">결제 승인 일시</td><td class="pay-value">${approvedAt}</td></tr>
                <tr><td class="pay-label">거래 번호</td><td class="pay-value pay-tid">${p.tid || '-'}</td></tr>
              </table>
              <div class="pay-total-row">
                <span class="pay-total-label">결제 금액</span>
                <span class="pay-total-value">${fmtMoney(p.total_amount)}</span>
              </div>
            </div>`;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error('결제 내역 로드 실패:', err);
        container.innerHTML = `
          <div class="pay-empty">
            <div class="pay-empty-icon">⚠️</div>
            <p class="pay-empty-text">결제 내역을 불러올 수 없습니다.</p>
          </div>`;
      }
    }

    function togglePayOpts(btn) {
      const list   = btn.nextElementSibling;
      const arrow  = btn.querySelector('.pay-opts-arrow');
      const isOpen = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!isOpen));
      list.style.display = isOpen ? 'none' : 'block';
      arrow.textContent  = isOpen ? '▼' : '▲';
      btn.querySelector('span:last-child').textContent = isOpen ? '옵션 보기' : '옵션 닫기';
    }

    // ========================================
    // 프로필 이미지
    // ========================================
    function displayProfileImage(imageData) {
      if (imageData) {
        const existingImg = profileImageContainer.querySelector('img');
        if (existingImg) {
          existingImg.remove();
        }
        
        const img = document.createElement('img');
        img.src = imageData;
        img.alt = 'Profile Image';
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        profileImageContainer.appendChild(img);
        profileImagePlaceholder.style.display = 'none';
        
        hasProfileImage = true;
        profileImageActions.style.display = 'flex';
        profileImageContainer.style.cursor = 'default';
      } else {
        const existingImg = profileImageContainer.querySelector('img');
        if (existingImg) {
          existingImg.remove();
        }
        profileImagePlaceholder.style.display = 'block';
        
        hasProfileImage = false;
        profileImageActions.style.display = 'none';
        profileImageContainer.style.cursor = 'pointer';
      }
    }

    profileImageContainer.addEventListener('click', () => {
      if (!hasProfileImage) {
        profileImageInput.click();
      }
    });

    editImageBtn.addEventListener('click', () => {
      profileImageInput.click();
    });

    deleteImageBtn.addEventListener('click', async () => {
      if (!confirm('프로필 이미지를 삭제하시겠습니까?')) return;

      try {
        const response = await fetch('/api/user/profile-image', { method: 'DELETE' });
        const data = await response.json();

        if (data.success) {
          displayProfileImage(null);
          showAlert('프로필 이미지가 삭제되었습니다.', 'success');
        } else {
          showAlert(data.message || '이미지 삭제에 실패했습니다.', 'error');
        }
      } catch (error) {
        console.error('이미지 삭제 오류:', error);
        showAlert('이미지 삭제 중 오류가 발생했습니다.', 'error');
      }
    });

    // 이미지 선택 시 크롭 모달 열기
    profileImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        showAlert('이미지 파일만 업로드 가능합니다.', 'error');
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        showAlert('이미지 크기는 10MB 이하여야 합니다.', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        cropImage.src = event.target.result;
        cropModal.classList.add('show');

        if (cropper) {
          cropper.destroy();
        }

        cropper = new Cropper(cropImage, {
          aspectRatio: 1,
          viewMode: 1,
          dragMode: 'move',
          autoCropArea: 0.8,
          restore: false,
          guides: true,
          center: true,
          highlight: false,
          cropBoxMovable: true,
          cropBoxResizable: true,
          toggleDragModeOnDblclick: false,
          ready() {
            const cropBox = document.querySelector('.cropper-crop-box');
            if (cropBox) {
              cropBox.style.borderRadius = '50%';
            }
            const face = document.querySelector('.cropper-face');
            if (face) {
              face.style.borderRadius = '50%';
            }
          }
        });
      };

      reader.readAsDataURL(file);
      e.target.value = '';
    });

    cancelCrop.addEventListener('click', () => {
      cropModal.classList.remove('show');
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    });

    confirmCrop.addEventListener('click', async () => {
      if (!cropper) return;

      try {
        const canvas = cropper.getCroppedCanvas({
          width: 100,
          height: 100,
          imageSmoothingEnabled: true,
          imageSmoothingQuality: 'high',
        });

        const base64Image = canvas.toDataURL('image/jpeg', 0.9);

        cropModal.classList.remove('show');
        if (cropper) {
          cropper.destroy();
          cropper = null;
        }

        const response = await fetch('/api/user/profile-image', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ profileImage: base64Image })
        });

        const data = await response.json();

        if (data.success) {
          displayProfileImage(base64Image);
          showAlert('프로필 이미지가 변경되었습니다.', 'success');
        } else {
          showAlert(data.message || '이미지 업로드에 실패했습니다.', 'error');
        }

      } catch (error) {
        console.error('이미지 업로드 오류:', error);
        showAlert('이미지 업로드 중 오류가 발생했습니다.', 'error');
      }
    });

    // ========================================
    // 사용자 정보 로드
    // ========================================
    async function loadUserInfo() {
      try {
        const response = await fetch('/api/user/info');
        const data = await response.json();

        if (!data.success) {
          window.location.href = '/login.html';
          return;
        }

        const user = data.user;
        
        displayProfileImage(user.profile_image);
        
        document.getElementById('userName').textContent = user.nickname;
        document.getElementById('userEmail').textContent = user.email;
        
        document.getElementById('displayEmail').textContent = user.email;
        document.getElementById('displayNickname').textContent = user.nickname;
        document.getElementById('displayPhone').textContent = user.tel_number;
        document.getElementById('displayAddress').textContent = 
          user.address + (user.address_detail ? ' ' + user.address_detail : '');
        document.getElementById('displayMarketing').textContent = 
          user.marketing_agree ? '동의' : '비동의';
        
        document.getElementById('nickname').value = user.nickname;
        document.getElementById('tel_number').value = user.tel_number;
        document.getElementById('address').value = user.address;
        document.getElementById('address_detail').value = user.address_detail || '';
        document.getElementById('marketing_agree').checked = user.marketing_agree == 1;

      } catch (error) {
        console.error('사용자 정보 로드 오류:', error);
        window.location.href = '/login.html';
      }
    }

    // ========================================
    // 정보 수정
    // ========================================
    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        nickname: document.getElementById('nickname').value,
        tel_number: document.getElementById('tel_number').value,
        address: document.getElementById('address').value,
        address_detail: document.getElementById('address_detail').value || null,
        marketing_agree: document.getElementById('marketing_agree').checked ? 1 : 0
      };

      try {
        const response = await fetch('/api/user/info', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
          showAlert('회원정보가 수정되었습니다.', 'success');
          loadUserInfo();
        } else {
          showAlert(data.message, 'error');
        }
      } catch (error) {
        console.error('정보 수정 오류:', error);
        showAlert('정보 수정 중 오류가 발생했습니다.', 'error');
      }
    });

    // ========================================
    // 비밀번호 변경
    // ========================================
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      
      if (newPassword !== confirmNewPassword) {
        showAlert('새 비밀번호가 일치하지 않습니다.', 'error');
        return;
      }

      const formData = {
        currentPassword: document.getElementById('currentPassword').value,
        newPassword: newPassword
      };

      try {
        const response = await fetch('/api/user/password', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
          showAlert('비밀번호가 변경되었습니다.', 'success');
          document.getElementById('passwordForm').reset();
        } else {
          showAlert(data.message, 'error');
        }
      } catch (error) {
        console.error('비밀번호 변경 오류:', error);
        showAlert('비밀번호 변경 중 오류가 발생했습니다.', 'error');
      }
    });

    // ========================================
    // 로그아웃 & 회원탈퇴
    // ========================================
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (!confirm('로그아웃 하시겠습니까?')) return;

      try {
        const response = await fetch('/api/auth/logout', { method: 'POST' });
        const data = await response.json();

        if (data.success) {
          window.location.href = '/login.html';
        }
      } catch (error) {
        console.error('로그아웃 오류:', error);
      }
    });

    document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
      const password = prompt('회원 탈퇴를 위해 비밀번호를 입력하세요:');
      
      if (!password) return;
      
      if (!confirm('정말로 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

      try {
        const response = await fetch('/api/user/account', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          alert('회원 탈퇴가 완료되었습니다.');
          window.location.href = '/login.html';
        } else {
          showAlert(data.message, 'error');
        }
      } catch (error) {
        console.error('회원 탈퇴 오류:', error);
        showAlert('회원 탈퇴 처리 중 오류가 발생했습니다.', 'error');
      }
    });

    // 전화번호 자동 포맷팅
    document.getElementById('tel_number').addEventListener('input', function(e) {
      let value = e.target.value.replace(/[^0-9]/g, '');
      let formatted = '';
      
      if (value.length <= 3) {
        formatted = value;
      } else if (value.length <= 7) {
        formatted = value.slice(0, 3) + '-' + value.slice(3);
      } else if (value.length <= 11) {
        formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
      } else {
        formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
      }
      
      e.target.value = formatted;
    });

    // 페이지 로드
    loadUserInfo();
  </script>
</body>
</html>
