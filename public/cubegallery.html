      <!-- =============================================
           SEARCH BAR + 글쓰기 BUTTON
           ============================================= -->
      <div class="container-14">
        <div class="container-15">
          <div class="text-input">
            <input type="text" id="gallery-search" placeholder="검색어를 입력하세요..."
              style="width:100%;height:100%;border:none;outline:none;background:transparent;font-family:'Arial-Regular',Arial,sans-serif;font-size:16px;color:#374151;" />
          </div>
          <div class="icon-2" id="search-btn" style="cursor:pointer;">
            <img class="vector-9" src="galleryimg/vector-3.svg" alt="" role="presentation" />
            <img class="vector-10" src="galleryimg/vector-4.svg" alt="" role="presentation" />
          </div>
        </div>
        <a href="cubegallerywrite.html" style="text-decoration:none;">
          <div class="button"><div class="text-38 arial-regular-normal-white-16px">글쓰기</div></div>
        </a>
      </div>

      <!-- =============================================
           POST LIST
           — DB fields mapped per card:
             data-post-id   → post_id
             data-user-id   → user_id
             .post-title    → title
             .post-content  → content
             .post-thumb    → image_url  (background-image)
             .post-author   → user_id (display name via JOIN)
             .post-date     → created_at
             .post-likes    → like_count
             .post-views    → view_count
           ============================================= -->
      <div class="container-16">
        <div class="paragraph-10">
          <div class="text-40">
            <span class="arial-regular-normal-abbey-16px">총 </span>
            <span class="span1" id="post-count">6</span>

        <div class="container-17" id="post-list">
          <div class="gallery-loading">불러오는 중...</div>
        </div><!-- /#post-list -->

        <!-- 페이지네이션 -->
        <div id="gallery-pagination" style="display:none; justify-content:center; align-items:center; gap:6px; margin-top:32px; flex-wrap:wrap;"></div>

      </div><!-- /.container-16 -->

      <!-- =============================================
           FOOTER
           ============================================= -->
      <footer class="footer">
        <div class="footer-content">

              <div class="paragraph-3"><a class="text-59 arial-regular-normal-santas-gray-16px" href="#">사용자 성향 파악</a></div>
              <div class="paragraph-3"><a class="text-60 arial-regular-normal-santas-gray-16px" href="#">방문 예약</a></div>
            </div>
          </div>
          <div class="footer-column-1">
            <div class="paragraph-12"><div class="text-61 arial-bold-white-18px">제품</div></div>
            <div class="container-10 arial-regular-normal-santas-gray-16px">
              <div class="paragraph-2"><a class="text-6" href="#">커스텀 큐브</a></div>
              <div class="paragraph-3"><a class="text-6" href="#">큐브 갤러리</a></div>
              <div class="text-65">판매 페이지</div>
              <div class="paragraph-3">
                <div class="paragraph-13"><a class="text-64" href="#">중고 큐브마켓</a></div>
              </div>
            </div>
          </div>
          <div class="container-20">
            <div class="container-21">

                <div class="text-66 arial-regular-normal-santas-gray-16px">혁신적인 컨테이너 하우스로</div>

                <div class="text-67 arial-regular-normal-santas-gray-16px">새로운 주거 문화를 만들어갑니다</div>
              </div>
            </div>

        <div class="footer-bottom">
          <div class="container-22"></div>
          <div class="container-23">

                  © 2026 Container House. All rights reserved.

    </div><!-- /.cubeu95gallery1-1.screen -->

  <!-- ── 게시글 상세 모달 ── -->
  <div id="gallery-modal" class="gallery-modal-overlay">
    <div class="gallery-modal-box">
      <button class="gallery-modal-close" id="modal-close-btn">✕</button>
      <img id="modal-img" class="gallery-modal-img" src="" alt="" />
      <div class="gallery-modal-body">
        <h2 class="gallery-modal-title" id="modal-title"></h2>
        <div class="gallery-modal-meta">
          <span>👤 <span id="modal-author"></span></span>
          <span>📅 <span id="modal-date"></span></span>
        </div>
        <p class="gallery-modal-content" id="modal-content"></p>
        <div class="gallery-modal-stats">
          <button class="gallery-modal-like-btn" id="modal-like-btn">
            <span class="like-heart">🤍</span>
            <span id="modal-likes">0</span>
          </button>
          <span class="gallery-modal-views">
            👁 <span id="modal-views">0</span>
          </span>
        </div>
        <!-- 본인 게시글일 때만 표시 -->
        <div class="gallery-modal-actions" id="modal-actions" style="display:none; margin-top:14px; display:none; gap:8px; justify-content:flex-end;">
          <button class="gallery-action-btn gallery-edit-btn" id="modal-edit-btn">수정</button>
          <button class="gallery-action-btn gallery-delete-btn" id="modal-delete-btn">삭제</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    let currentPostId = null;
    let currentUserId = null; // 로그인된 계정 userId (세션 기반)

    // 현재 로그인 계정 ID 조회
    fetch('/api/auth/check')
      .then(r => r.json())
      .then(d => { if (d.loggedIn) currentUserId = d.userId; })
      .catch(() => {});

    document.addEventListener('DOMContentLoaded', () => {
      loadPosts();

      // 수정 버튼
      document.getElementById('modal-edit-btn').addEventListener('click', () => {
        if (currentPostId) location.href = `/cubegallerywrite.html?edit=${currentPostId}`;
      });

      // 삭제 버튼
      document.getElementById('modal-delete-btn').addEventListener('click', async () => {
        if (!currentPostId) return;
        if (!confirm('게시글을 삭제하시겠습니까?')) return;
        try {
          const res = await fetch(`/api/gallery/${currentPostId}`, { method: 'DELETE' });
          const data = await res.json();
          if (!data.success) throw new Error(data.message);
          closeModal();
          loadPosts();
        } catch (err) {
          alert(err.message || '삭제에 실패했습니다.');
        }
      });

      // 검색
      const searchInput = document.getElementById('gallery-search');
      const searchBtn   = document.getElementById('search-btn');
      function doSearch() { loadPosts(1, searchInput.value.trim()); }
      searchBtn.addEventListener('click', doSearch);
      searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

      // 모달 닫기
      document.getElementById('gallery-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      document.getElementById('modal-like-btn').addEventListener('click', toggleLike);

      // ESC 닫기
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    });

    let _currentPage = 1;
    let _currentQ    = '';

    async function loadPosts(page = 1, q = '') {
      _currentPage = page;
      _currentQ    = q;
      const list = document.getElementById('post-list');
      list.innerHTML = '<div class="gallery-loading">불러오는 중...</div>';
      try {
        const res  = await fetch(`/api/gallery?page=${page}&limit=8&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        document.getElementById('post-count').textContent = data.pagination.total;

        if (data.data.length === 0) {
          list.innerHTML = '<div class="gallery-empty">등록된 게시물이 없습니다.</div>';
          renderPagination(data.pagination);
          return;
        }

        list.innerHTML = data.data.map(renderCard).join('');
        list.querySelectorAll('[data-post-id]').forEach(card => {
          card.addEventListener('click', () => openModal(card.dataset.postId));
        });
        renderPagination(data.pagination);
      } catch (err) {
        list.innerHTML = '<div class="gallery-empty">게시물을 불러오지 못했습니다.</div>';
        console.error('[gallery] loadPosts:', err);
      }
    }

    function renderPagination({ page, totalPages }) {
      const nav = document.getElementById('gallery-pagination');
      if (totalPages <= 1) { nav.style.display = 'none'; return; }
      nav.style.display = 'flex';

      const btn = (label, targetPage, disabled, active) => {
        const el = document.createElement('button');
        el.textContent  = label;
        el.disabled     = disabled;
        el.style.cssText = `
          min-width:36px; height:36px; padding:0 10px;
          border-radius:8px; border:1px solid ${active ? '#667eea' : '#d1d5db'};
          background:${active ? '#667eea' : '#fff'}; color:${active ? '#fff' : '#374151'};
          font-size:14px; font-weight:${active ? '700' : '400'};
          cursor:${disabled ? 'default' : 'pointer'}; opacity:${disabled ? '0.35' : '1'};
          transition:all 0.15s;
        `;
        if (!disabled && !active) {
          el.addEventListener('mouseover', () => { el.style.borderColor='#667eea'; el.style.color='#667eea'; });
          el.addEventListener('mouseout',  () => { el.style.borderColor='#d1d5db'; el.style.color='#374151'; });
        }
        if (!disabled) el.addEventListener('click', () => loadPosts(targetPage, _currentQ));
        return el;
      };

      nav.innerHTML = '';
      nav.appendChild(btn('〈', page - 1, page === 1, false));

      for (let i = 1; i <= totalPages; i++) {
        nav.appendChild(btn(String(i), i, false, i === page));
      }

      nav.appendChild(btn('〉', page + 1, page === totalPages, false));
    }

    function renderCard(post) {
      const thumbStyle = post.image_url
        ? `background-image:url('${esc(post.image_url)}');background-size:cover;background-position:center;`
        : '';
      const date = fmtDate(post.created_at);
      return `
        <div class="container" data-post-id="${post.post_id}" style="cursor:pointer;">
          <div class="container-1">
            <div class="container-2">
              <div class="heading-3">
                <div class="text arial-regular-normal-eerie-black-20px post-title">${esc(post.title)}</div>
              </div>
              <div class="paragraph-1">
                <p class="text_label arial-regular-normal-abbey-14px post-content">${esc(post.short_intro || '')}</p>
              </div>
            </div>
            <div class="container-3">
              <div class="container-4">
                <div class="container-5">
                  <div class="icon">
                    <img class="vector"   src="galleryimg/vector-5.svg" alt="" role="presentation" />
                    <img class="vector-1" src="galleryimg/vector-6.svg" alt="" role="presentation" />
                  </div>
                  <div class="text-1"><div class="arial-regular-normal-black-14px post-author">${esc(post.author_name || '익명')}</div></div>
                </div>
                <div class="container-6">
                  <div class="icon">
                    <img class="vector-2" src="galleryimg/vector-7.svg"  alt="" role="presentation" />
                    <img class="vector-3" src="galleryimg/vector-8.svg"  alt="" role="presentation" />
                    <img class="vector-4" src="galleryimg/vector-9.svg"  alt="" role="presentation" />
                    <img class="vector-5" src="galleryimg/vector-10.svg" alt="" role="presentation" />
                  </div>
                  <div class="text-1"><div class="arial-regular-normal-black-14px post-date">${date}</div></div>
                </div>
              </div>
              <div class="container-7">
                <div class="container-8">
                  <div class="icon-1"><img class="vector-6" src="galleryimg/vector-11.svg" alt="좋아요" /></div>
                  <div class="text-2"><div class="number arial-regular-normal-abbey-16px post-likes">${post.like_count || 0}</div></div>
                </div>
                <div class="container-9">
                  <div class="icon-1">
                    <img class="vector-7" src="galleryimg/vector-12.svg" alt="조회수" />
                    <img class="vector-8" src="galleryimg/vector-13.svg" alt="" role="presentation" />
                  </div>
                  <div class="text-2"><div class="number arial-regular-normal-abbey-16px post-views">${post.view_count || 0}</div></div>
                </div>
              </div>
            </div>
          </div>
          <div class="post-thumb" style="${thumbStyle}"></div>
        </div>`;
    }

    async function openModal(postId) {
      currentPostId = postId;
      const modal = document.getElementById('gallery-modal');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      // 로딩 상태
      document.getElementById('modal-title').textContent   = '불러오는 중...';
      document.getElementById('modal-content').textContent = '';
      document.getElementById('modal-author').textContent  = '';
      document.getElementById('modal-date').textContent    = '';
      document.getElementById('modal-img').classList.add('hidden');

      try {
        const res  = await fetch(`/api/gallery/${postId}`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        const post = data.data;
        const img  = document.getElementById('modal-img');
        if (post.image_url) {
          img.src = post.image_url;
          img.classList.remove('hidden');
        } else {
          img.classList.add('hidden');
        }

        document.getElementById('modal-title').textContent   = post.title;
        document.getElementById('modal-author').textContent  = post.author_name || '익명';
        document.getElementById('modal-date').textContent    = fmtDate(post.created_at);
        document.getElementById('modal-content').textContent = post.content;
        document.getElementById('modal-likes').textContent   = post.like_count || 0;
        document.getElementById('modal-views').textContent   = post.view_count || 0;

        // 본인 게시글이면 수정/삭제 버튼 표시
        const actions = document.getElementById('modal-actions');
        if (currentUserId && post.user_id === currentUserId) {
          actions.style.display = 'flex';
        } else {
          actions.style.display = 'none';
        }

        const likeBtn = document.getElementById('modal-like-btn');
        const heart   = likeBtn.querySelector('.like-heart');
        if (post.liked) {
          likeBtn.classList.add('liked');
          heart.textContent = '❤️';
        } else {
          likeBtn.classList.remove('liked');
          heart.textContent = '🤍';
        }

        // 카드 조회수 실시간 반영
        const viewEl = document.querySelector(`[data-post-id="${postId}"] .post-views`);
        if (viewEl) viewEl.textContent = post.view_count || 0;

      } catch (err) {
        document.getElementById('modal-title').textContent = '불러오기 실패';
        console.error('[gallery] openModal:', err);
      }
    }

    function closeModal() {
      document.getElementById('gallery-modal').classList.remove('open');
      document.body.style.overflow = '';
      currentPostId = null;
    }

    async function toggleLike() {
      if (!currentPostId) return;
      try {
        const res  = await fetch(`/api/gallery/${currentPostId}/like`, { method: 'POST' });
        const data = await res.json();

        if (res.status === 401) {
          alert('로그인이 필요합니다.');
          return;
        }
        if (!data.success) throw new Error(data.message);

        const likeBtn = document.getElementById('modal-like-btn');
        const heart   = likeBtn.querySelector('.like-heart');
        document.getElementById('modal-likes').textContent = data.likeCount;

        if (data.liked) {
          likeBtn.classList.add('liked');
          heart.textContent = '❤️';
        } else {
          likeBtn.classList.remove('liked');
          heart.textContent = '🤍';
        }

        // 카드 좋아요 수 실시간 반영
        const likeEl = document.querySelector(`[data-post-id="${currentPostId}"] .post-likes`);
        if (likeEl) likeEl.textContent = data.likeCount;

      } catch (err) {
        console.error('[gallery] toggleLike:', err);
      }
    }

    function fmtDate(str) {
      if (!str) return '';
      const d = new Date(str);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
  </script>
  <script src="/js/navbar.js"></script>
  <script src="/js/footer.js"></script>
  </body>
</html>
